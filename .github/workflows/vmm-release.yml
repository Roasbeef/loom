# Publish the microVM tier's prebuilt artifacts for a release tag.
#
# `loom-vm setup --release TAG` installs what this workflow publishes, so that
# a developer never runs the 11-minute guest-root build or the 7-minute kernel
# build (docs/distribution.md, "The microVM artifacts"). It publishes:
#
#   ghcr.io/<owner>/loom-guest:<tag>   the guest root, a multi-arch image
#                                      (linux/arm64 and linux/amd64)
#   go-microvm-runner-darwin-arm64     the libkrun runner, ad-hoc signed
#   libkrunfw-landlock-darwin-arm64.5.dylib
#                                      libkrunfw with Landlock (ADR-022, D3)
#   vmm-SHA256SUMS                     the digests of the two files above
#
# The three files are attached to the release's GitHub release. They are not
# the server archives and they are not covered by the release workflow's
# reproduction check or its SHA256SUMS; release.yml owns those, and a release
# cannot hold two assets named SHA256SUMS, which is why this file is
# vmm-SHA256SUMS. Nothing here is signed with a Developer ID. The runner's
# signature is ad hoc, and `loom-vm setup` re-signs it anyway, so the digest in
# vmm-SHA256SUMS is the integrity check.
#
# Two callers reach this workflow, and they differ in when the release exists.
#
# A `v*` tag starts it beside release.yml. That workflow creates the release as
# a draft after its builds succeed, which takes tens of minutes. The last job
# therefore waits for the draft to exist and attaches the assets to it. Both
# must finish before the draft is published: a published release cannot take
# assets when immutable releases are enabled.
#
# The nightly (nightly-release.yml) calls it with the tag `commit-<40 hex>`.
# release.yml creates that release already published, in the same command that
# uploads the server archives, so there is no draft to attach to and no later
# moment at which an asset could be added. The nightly runs this workflow
# first; for a `commit-*` tag the last job is skipped, the three files stay in
# this run's `vmm-assets` artifact, and release.yml uploads them with the
# server archives. A failed run here leaves that artifact absent, and the
# nightly then publishes the server release without them.
#
# Reruns change nothing that exists. The image tag is pushed only when it does
# not resolve yet, a `commit-*` tag whose release exists is skipped whole, and
# the asset upload skips a release that already carries vmm-SHA256SUMS.
#
# The guest image is the one thing that must be made public by hand, once.
# GHCR creates a package private on its first push; `loom-vm setup` pulls it
# anonymously, so set `loom-guest` to public in the package settings. The
# image's org.opencontainers.image.source label links the package to this
# repository, which is what lets the workflow's token push it.
name: Publish microVM artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* release tag to publish artifacts for. A commit-* tag builds the image, the kernel and the macOS assets, keeps the assets in this run's vmm-assets artifact and attaches nothing; never a branch or commit.
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Release tag, or commit-<40 hex> for a nightly of that main commit.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: vmm-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
      skip: ${{ steps.identity.outputs.skip }}
      image_exists: ${{ steps.identity.outputs.image_exists }}
    steps:
      # A tag is checked before it names anything to check out, so that text
      # which is not a release tag is never resolved as a branch or commit.
      - name: Check tag syntax
        id: syntax
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^(v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?|commit-[0-9a-f]{40})$ ]]
          # A nightly's tag does not exist until release.yml creates the
          # release, so its commit is checked out by name, and the identity
          # step confirms it is exactly that commit.
          if [[ "$RELEASE_TAG" == commit-* ]]; then
            echo "ref=${RELEASE_TAG#commit-}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=refs/tags/$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.syntax.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the run to the tag's commit
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          skip=false
          if [[ "$RELEASE_TAG" == commit-* ]]; then
            # The checks release.yml applies to a nightly's source commit: the
            # checkout is exactly the commit the tag names, that commit is on
            # main, and an existing tag of that name points at it.
            commit="${RELEASE_TAG#commit-}"
            [ "$(git rev-parse HEAD)" = "$commit" ]
            git merge-base --is-ancestor "$commit" origin/main
            if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
              [ "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$commit" ]
            fi
            # release.yml publishes a nightly with its assets in one step, so
            # a release that exists can take no more, and a rerun builds
            # nothing.
            names=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name')
            if printf '%s\n' "$names" | grep -Fx "$RELEASE_TAG" > /dev/null; then
              skip=true
            fi
          else
            # The same syntax and version check release.yml applies, so that a
            # tag this workflow accepts is one the release workflow builds.
            python3 scripts/release-tag.py "$RELEASE_TAG" --check
          fi

          image_exists=false
          if [ "$skip" = false ]; then
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loom-guest"
            printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            # A tag that already resolves is never pushed again: the builds are
            # not reproducible, so a second push would move the tag to bytes
            # that someone may have installed from the first.
            if inspected=$(docker buildx imagetools inspect "$image:$RELEASE_TAG" 2>&1); then
              printf '%s\n' "$inspected"
              grep -E 'Platform:[[:space:]]+linux/arm64' <<<"$inspected"
              grep -E 'Platform:[[:space:]]+linux/amd64' <<<"$inspected"
              image_exists=true
            elif grep -iE 'not found|denied|unauthorized' <<<"$inspected" > /dev/null; then
              # An absent tag, or a package the first push has yet to create.
              # A registry that denies a read would deny the push too.
              echo "no $image:$RELEASE_TAG yet"
            else
              printf '%s\n' "$inspected" >&2
              exit 1
            fi
          fi
          {
            echo "tag=$RELEASE_TAG"
            echo "commit=$(git rev-parse HEAD)"
            echo "skip=$skip"
            echo "image_exists=$image_exists"
          } >> "$GITHUB_OUTPUT"

  # One native build per architecture. Each pushes its image by digest only,
  # with no tag, so that the tag never points at half a release; the job after
  # this one joins the digests into the manifest list that carries the tag.
  guest-image:
    needs: prepare
    if: ${{ needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.image_exists != 'true' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Build and push the image by digest
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loom-guest"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Pushing by digest needs the docker-container driver; the default
          # driver cannot export an image without tagging it.
          docker buildx create --name loom-guest-builder --driver docker-container --use
          # Provenance and SBOM attestations are separate manifests in the
          # image index, which `loom-vm setup` does not read and a manifest
          # list over these digests would have to carry as extra platforms.
          docker buildx build \
            --platform "linux/$ARCH" \
            --file packages/vmm/guest/Dockerfile \
            --target runtime \
            --build-arg "LOOM_REVISION=$SOURCE_COMMIT" \
            --build-arg "LOOM_VERSION=$RELEASE_TAG" \
            --provenance=false --sbom=false \
            --output "type=image,name=$image,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json \
            .
          digest=$(jq -er '."containerimage.digest"' metadata.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p digests
          printf '%s\n' "$digest" > "digests/$ARCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guest-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  guest-manifest:
    needs: [prepare, guest-image]
    if: ${{ needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.image_exists != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: guest-digest-*
          path: digests
          merge-multiple: true
      - name: Join the per-architecture images under the release tag
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loom-guest"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          arm64=$(cat digests/arm64)
          amd64=$(cat digests/amd64)
          docker buildx imagetools create -t "$image:$RELEASE_TAG" \
            "$image@$arm64" "$image@$amd64"
          # The tag must now resolve to a list with both platforms; setup
          # selects the host's by architecture and would fail on a missing one.
          inspected=$(docker buildx imagetools inspect "$image:$RELEASE_TAG")
          printf '%s\n' "$inspected"
          grep -E 'Platform:[[:space:]]+linux/arm64' <<<"$inspected"
          grep -E 'Platform:[[:space:]]+linux/amd64' <<<"$inspected"

  # The Landlock kernel is built on Linux, because the kernel build needs a
  # Linux userland, and linked into a dylib on macOS, because the dylib is a
  # Mach-O. kernel.c is the hand-off between them (build-libkrunfw.sh). The
  # kernel is built for the machine it is built on, and the dylib serves an
  # arm64 guest, so the job runs on an arm64 runner; an x86_64 kernel inside
  # the arm64 dylib makes the runner exit as soon as the guest starts.
  firmware-kernel:
    needs: prepare
    if: ${{ needs.prepare.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Build kernel.c with Landlock
        run: packages/vmm/guest/build-libkrunfw.sh --kernel "$RUNNER_TEMP/kernel"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libkrunfw-kernel
          path: ${{ runner.temp }}/kernel/kernel.c
          if-no-files-found: error
          retention-days: 3

  # The runner links libkrun with cgo, so it is built against Homebrew's
  # libkrun, which is also where `loom-vm setup` expects the user's copy: the
  # runner records /opt/homebrew/opt/libkrun/lib/libkrun.1.dylib as its install
  # name.
  macos-assets:
    needs: [prepare, firmware-kernel]
    if: ${{ needs.prepare.outputs.skip != 'true' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.3'
          cache-dependency-path: packages/vmm/go.sum
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: libkrunfw-kernel
          path: kernel
      - name: Link the firmware dylib
        run: |
          set -euo pipefail
          mkdir -p assets
          packages/vmm/guest/build-libkrunfw.sh --link kernel/kernel.c "$RUNNER_TEMP/firmware"
          cp "$RUNNER_TEMP/firmware/libkrunfw.5.dylib" assets/libkrunfw-landlock-darwin-arm64.5.dylib
      - name: Install libkrun
        run: |
          set -euo pipefail
          # libkrun is not in homebrew-core; it comes from its own tap.
          brew tap libkrun/krun
          brew trust libkrun/krun 2>/dev/null || true
          brew install libkrun/krun/libkrun
          brew list --versions libkrun
      - name: Build and sign the runner
        run: |
          set -euo pipefail
          make vmm-runner
          cp packages/vmm/build/go-microvm-runner assets/go-microvm-runner-darwin-arm64
          # The build must have produced a runner that holds the entitlement
          # and links Homebrew's libkrun, or setup would install a dud.
          # codesign prints the entitlements as a dump on current macOS and
          # as an XML property list on older releases; accept either.
          codesign -d --entitlements - assets/go-microvm-runner-darwin-arm64 2>&1 \
            | tr -d '\n\t ' \
            | grep -E 'com\.apple\.security\.hypervisor(\[Value\]\[Bool\]true|</key><true/>)'
          otool -L assets/go-microvm-runner-darwin-arm64 | grep -F '/opt/homebrew/opt/libkrun/lib/libkrun.1.dylib'
      - name: Record the digests
        run: |
          set -euo pipefail
          cd assets
          # shasum prints the two-space form sha256sum does. The sums are made
          # here, with the files, so that a nightly's artifact is complete when
          # release.yml uploads it.
          shasum -a 256 go-microvm-runner-darwin-arm64 libkrunfw-landlock-darwin-arm64.5.dylib \
            > vmm-SHA256SUMS
          cat vmm-SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vmm-assets
          path: assets/*
          if-no-files-found: error
          overwrite: true

  # Only a version tag attaches here. A nightly's release does not exist until
  # release.yml publishes it with these files in the same command.
  publish:
    needs: [prepare, guest-manifest, macos-assets]
    if: >-
      ${{ !cancelled()
      && needs.prepare.outputs.skip != 'true'
      && !startsWith(needs.prepare.outputs.tag, 'commit-')
      && contains(fromJSON('["success","skipped"]'), needs.guest-manifest.result)
      && needs.macos-assets.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: vmm-assets
          path: assets
      - name: Attach the assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cd assets
          cat vmm-SHA256SUMS

          # release.yml creates the draft once both platforms have built and
          # been compared. Wait for it rather than create a second release
          # for the tag: a release it then refuses to create would stop the
          # server archives from publishing.
          id=""
          for _ in $(seq 1 220); do
            id=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
              --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .id' | head -n 1 || true)
            [ -n "$id" ] && break
            echo "waiting for the $RELEASE_TAG release to be created"
            sleep 60
          done
          [ -n "$id" ] || { echo "no release for $RELEASE_TAG appeared" >&2; exit 1; }

          # The checksum file goes last, so its presence means a previous run
          # attached all three. That run's bytes stay: a second build is not
          # byte-identical, and the checksums must describe the files that
          # are attached.
          existing=$(gh api "repos/$GH_REPO/releases/$id" --jq '.assets[].name')
          if printf '%s\n' "$existing" | grep -Fx vmm-SHA256SUMS > /dev/null; then
            echo "$RELEASE_TAG already carries vmm-SHA256SUMS; nothing to attach"
            exit 0
          fi

          # No overwrite path: any other existing asset of the same name fails
          # the upload (HTTP 422) instead of replacing bytes someone may have
          # installed from. That is a partial earlier run for an operator.
          for asset in go-microvm-runner-darwin-arm64 \
                       libkrunfw-landlock-darwin-arm64.5.dylib \
                       vmm-SHA256SUMS; do
            gh api --method POST \
              "https://uploads.github.com/repos/$GH_REPO/releases/$id/assets?name=$asset" \
              -H 'Content-Type: application/octet-stream' \
              --input "$asset" > /dev/null
            echo "attached $asset"
          done
