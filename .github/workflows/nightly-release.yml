# Publishes a nightly build of main as the prerelease `commit-<full-sha>`.
#
# The tag is the commit SHA rather than a date, so a release identifies its
# source exactly and a rerun that finds it already published builds nothing.
# Main is resolved to a SHA once, in the `resolve` job, and every later step
# builds and publishes that SHA, so a push to main while the builds run cannot
# change what is released.
# Runs are serialized so two captures of main cannot publish concurrently.
name: Publish nightly
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: publish-nightly
  cancel-in-progress: false
jobs:
  # Manual dispatch can select any ref; only a run from main may publish.
  resolve:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.main.outputs.commit }}
    steps:
      - name: Capture main once
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          commit=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
  # The microVM artifacts come first. release.yml publishes a nightly in one
  # command, with its assets, and an immutable release takes no asset after
  # that, so these files must exist when it runs. The job's permissions are the
  # most the called workflow's jobs can hold: packages: write pushes the guest
  # image, and contents: write is declared by the attach job, which a
  # `commit-*` tag skips.
  vmm:
    needs: resolve
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/vmm-release.yml
    with:
      tag: commit-${{ needs.resolve.outputs.commit }}
  # The server release is the main product, so a failed vmm run does not stop
  # it: the release is published without the microVM files, and `loom vm
  # setup` reports that they are not published for the build.
  publish:
    needs: [resolve, vmm]
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/release.yml
    with:
      source_commit: ${{ needs.resolve.outputs.commit }}
      vmm_assets: ${{ needs.vmm.result == 'success' }}
