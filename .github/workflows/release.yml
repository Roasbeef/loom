# Version tags create reviewed drafts; captured main commits publish nightlies.
name: Build release
on:
  workflow_call:
    inputs:
      source_commit:
        description: Captured main commit for an immutable nightly release.
        required: true
        type: string
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (never a branch or commit).
        required: true
        type: string
permissions:
  contents: read
  packages: read
concurrency:
  group: release-${{ inputs.source_commit || inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
      exists: ${{ steps.identity.outputs.exists }}
    steps:
      - name: Check tag syntax
        if: ${{ !inputs.source_commit }}
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_commit || format('refs/tags/{0}', inputs.tag || github.ref_name) }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind release to the checked-out source
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "$SOURCE_COMMIT" ]; then
            [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            [ "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" ]
            git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
            RELEASE_TAG="commit-$SOURCE_COMMIT"
            if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
              [ "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$SOURCE_COMMIT" ]
            fi
            tags=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name')
            if printf '%s\n' "$tags" | grep -Fx "$RELEASE_TAG" > /dev/null; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
            fi
          else
            python3 scripts/release-tag.py "$RELEASE_TAG" --check
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  linux:
    needs: prepare
    if: ${{ needs.prepare.outputs.exists != 'true' }}
    uses: ./.github/workflows/release-candidate.yml
    with:
      source_commit: ${{ needs.prepare.outputs.commit }}
      release_tag: ${{ needs.prepare.outputs.tag }}
      builder_image: ghcr.io/roasbeef/loom/release-builder@sha256:03edc3c58c7962f51b1faf4634d8efa4a0f63b1ca0699fc5eaaea45fa20694af
  macos:
    needs: prepare
    if: ${{ needs.prepare.outputs.exists != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        builder: [first, second]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          gleam-version: '1.19.0'
          otp-version: '29.0.5'
          rebar3-version: '3.27.0'
          go-version: '1.26.3'
          cache-namespace: release-macos-${{ matrix.builder }}
          cache: 'false'
      - name: Build from a clean fixed prefix
        env:
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
          LOOM_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          [ "$(uname -m)" = arm64 ]
          git clone --no-hardlinks "$GITHUB_WORKSPACE" /Users/Shared/loom-release
          cd /Users/Shared/loom-release
          [ "$(git rev-parse HEAD)" = "$SOURCE_COMMIT" ]
          export LOOM_BUILDER_ID="macos-15-${ImageVersion:?}"
          scripts/release-build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-macos-${{ matrix.builder }}
          path: /Users/Shared/loom-release/dist/*
          if-no-files-found: error
  publish:
    needs: [prepare, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: release-*
          path: candidates
      - name: Compare and bind all release assets
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: python3 scripts/release-stage.py candidates upload --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT"
      # No overwrite path: rerunning after creation fails rather than replacing
      # bytes that someone may already have installed from this release.
      - name: Publish the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
          NIGHTLY_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          if [ -n "$NIGHTLY_COMMIT" ]; then
            [ "$RELEASE_TAG" = "commit-$SOURCE_COMMIT" ]
            args=(--target "$SOURCE_COMMIT" --prerelease --latest=false --title "Loom nightly $SOURCE_COMMIT" --notes "Built from main commit $SOURCE_COMMIT. See reproduction.json for artifact comparison.")
          else
            actual=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
            [ "$actual" = "$SOURCE_COMMIT" ]
            args=(--draft --verify-tag --title "Loom $RELEASE_TAG" --notes-file docs/release-notes.md --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          fi
          gh release create "$RELEASE_TAG" "${args[@]}" upload/*
