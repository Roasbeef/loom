\* expect-violation: CheckoutIsWhatWasStopped
\* The shipped rule, state_apply.holds_tip: a tree whose HEAD already contains
\* the tip is left alone. The executor's workspace is not ahead of the laptop,
\* so only an earlier attempt's snapshot can make the tree contain the tip.
SPECIFICATION Spec2
CONSTANTS
    IntendDurable = TRUE
    AbortGuardsSent = TRUE
    RetireObserves = TRUE
    RefuseUncommitted = TRUE
    MaxInc = 7
    MaxCrashes = 1
    HoldsRule = "ancestry"
    BaseAhead = FALSE
    CellChecksOp = TRUE
    FenceApply = TRUE
    CaptureLeavesLaptop = FALSE
    OperatorAbandon = FALSE
    MaxEdits = 2
    MaxCommits = 8
    MaxAtt = 2
    MaxTok = 7
    MaxReruns = 1
    MaxLost = 1
    InitWs = {"good"}
    RebindUnused = TRUE
INVARIANTS
    CheckoutIsWhatWasStopped
CHECK_DEADLOCK FALSE
