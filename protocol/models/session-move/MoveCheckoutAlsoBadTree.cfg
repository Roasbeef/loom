\* A third clean configuration: the executor serves the checkout's workspace in
\* `worktree` mode but Git cannot make the session's tree (the repository is
\* gone, or the base ref does not exist). The attach admits a scope and the build
\* fails with `WorktreeFailed`, which the mover takes as passing. The host closes
\* the scope in the same step as the refusal, so no scope stays open without a
\* plane, and once the operator repairs the workspace the checkout lands at the
\* next incarnation. TLC must find no violation.
SPECIFICATION Spec2
CONSTANTS
    IntendDurable = TRUE
    AbortGuardsSent = TRUE
    RetireObserves = TRUE
    RefuseUncommitted = TRUE
    MaxInc = 7
    MaxCrashes = 0
    HoldsRule = "applied"
    BaseAhead = TRUE
    CellChecksOp = TRUE
    FenceApply = TRUE
    CaptureLeavesLaptop = FALSE
    OperatorAbandon = FALSE
    MaxEdits = 0
    MaxCommits = 8
    MaxAtt = 2
    MaxTok = 7
    MaxReruns = 1
    MaxLost = 1
    InitWs = {"badtree"}
    RebindClosedUnused = TRUE
    CloseFailedAttach = TRUE
    MismatchRefused = TRUE
    RebindOpen = FALSE
    OwnerDiesInAttach = FALSE
    CloseReboundUnserved = TRUE
    CloseFailedTree = TRUE
    LearnsUnderBound = TRUE
INVARIANTS
    TypeOK2
    OneOwner
    NoResurrection
    ActiveImpliesComplete
    OneServingHolder
    CheckoutIsWhatWasStopped
    LaptopUntouched
    NoApplyOutsideFence
    AbandonRestores
    NoLeak
    ClosedEmptyScopeTakesTheNextName
    OpenScopeKeepsWorkspace
    FailedBuildHoldsNoScope
PROPERTY
    CheckoutSettles
CHECK_DEADLOCK FALSE
