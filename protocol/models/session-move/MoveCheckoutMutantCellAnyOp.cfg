\* expect-violation: AbandonRestores
\* The cell is believed for any move, not only the one that wrote it. A move
\* that is abandoned and asked for again finds the earlier attempt's state and
\* its `done` mark, and carries a state that it did not capture.
SPECIFICATION Spec2
CONSTANTS
    IntendDurable = TRUE
    AbortGuardsSent = TRUE
    RetireObserves = TRUE
    RefuseUncommitted = TRUE
    MaxInc = 7
    MaxCrashes = 1
    HoldsRule = "applied"
    BaseAhead = TRUE
    CellChecksOp = FALSE
    FenceApply = TRUE
    CaptureLeavesLaptop = FALSE
    OperatorAbandon = FALSE
    MaxEdits = 2
    MaxCommits = 8
    MaxAtt = 2
    MaxTok = 7
    MaxReruns = 1
    MaxLost = 1
    InitWs = {"good"}
    RebindUnused = TRUE
INVARIANTS
    AbandonRestores
CHECK_DEADLOCK FALSE
