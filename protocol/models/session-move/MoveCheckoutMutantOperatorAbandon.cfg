\* expect-violation: NoLeak
\* An abandon on request, which only a directory member has, may arrive while
\* the source's landing scope is open: after the attach and before the close.
\* Nothing in the abandon closes the scope, so the executor's slot stays held
\* after the move settles. A local session on a member does not move yet; this
\* records what building that path has to close.
SPECIFICATION Spec2
CONSTANTS
    IntendDurable = TRUE
    AbortGuardsSent = TRUE
    RetireObserves = TRUE
    RefuseUncommitted = TRUE
    MaxInc = 7
    MaxCrashes = 1
    HoldsRule = "applied"
    BaseAhead = TRUE
    CellChecksOp = TRUE
    FenceApply = TRUE
    CaptureLeavesLaptop = FALSE
    OperatorAbandon = TRUE
    MaxEdits = 2
    MaxCommits = 8
    MaxAtt = 2
    MaxTok = 7
    MaxReruns = 1
    MaxLost = 1
    InitWs = {"good"}
    RebindUnused = TRUE
INVARIANTS
    NoLeak
CHECK_DEADLOCK FALSE
