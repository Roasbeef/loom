\* expect-violation: OpenScopeKeepsWorkspace
\* An attach that names another workspace rebinds an open scope as well as a
\* closed one. The scope that a failed attach left open, bound to a name the
\* executor does not serve, is rebound to the corrected workspace, and a scope
\* that is open changes workspace. A live session in a `shared` workspace has an
\* open scope with no tree record, so the same rule would move it.
SPECIFICATION Spec2
CONSTANTS
    IntendDurable = TRUE
    AbortGuardsSent = TRUE
    RetireObserves = TRUE
    RefuseUncommitted = TRUE
    MaxInc = 7
    MaxCrashes = 1
    HoldsRule = "applied"
    BaseAhead = TRUE
    CellChecksOp = TRUE
    FenceApply = TRUE
    CaptureLeavesLaptop = FALSE
    OperatorAbandon = FALSE
    MaxEdits = 0
    MaxCommits = 8
    MaxAtt = 2
    MaxTok = 7
    MaxReruns = 1
    MaxLost = 1
    InitWs = {"unknown"}
    RebindClosedUnused = TRUE
    CloseFailedAttach = FALSE
    MismatchRefused = TRUE
    RebindOpen = TRUE
INVARIANTS
    OpenScopeKeepsWorkspace
CHECK_DEADLOCK FALSE
