\* expect-violation: NoLeak
\* Not a rule turned off: the case the ruled rules leave. The source dies after
\* an attach for a name the executor does not serve and before it closes the
\* scope, so the scope is open and bound to that name. The operator corrects the
\* name, and the move is refused for the open scope's workspace and abandoned,
\* with the scope still open. The refusal names the workspace and the executor's
\* operator has to release the scope. `loom executor release` refuses an open
\* scope today, so the leftover stays until that is changed.
SPECIFICATION Spec2
CONSTANTS
    IntendDurable = TRUE
    AbortGuardsSent = TRUE
    RetireObserves = TRUE
    RefuseUncommitted = TRUE
    MaxInc = 7
    MaxCrashes = 1
    HoldsRule = "applied"
    BaseAhead = TRUE
    CellChecksOp = TRUE
    FenceApply = TRUE
    CaptureLeavesLaptop = FALSE
    OperatorAbandon = FALSE
    MaxEdits = 0
    MaxCommits = 8
    MaxAtt = 2
    MaxTok = 7
    MaxReruns = 1
    MaxLost = 1
    InitWs = {"unknown"}
    RebindClosedUnused = TRUE
    CloseFailedAttach = TRUE
    MismatchRefused = TRUE
    RebindOpen = FALSE
INVARIANTS
    NoLeak
CHECK_DEADLOCK FALSE
