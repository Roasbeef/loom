\* The clean model: every rule on, and the executor's apply rule is the one
\* the checkout needs ("applied"). TLC must find no violation.
SPECIFICATION Spec2
CONSTANTS
    IntendDurable = TRUE
    AbortGuardsSent = TRUE
    RetireObserves = TRUE
    RefuseUncommitted = TRUE
    MaxInc = 7
    MaxCrashes = 1
    HoldsRule = "applied"
    BaseAhead = TRUE
    CellChecksOp = TRUE
    FenceApply = TRUE
    CaptureLeavesLaptop = FALSE
    OperatorAbandon = FALSE
    MaxEdits = 2
    MaxCommits = 8
    MaxAtt = 2
    MaxTok = 7
    MaxReruns = 1
    MaxLost = 1
INVARIANTS
    TypeOK2
    OneOwner
    NoResurrection
    ActiveImpliesComplete
    OneServingHolder
    CheckoutIsWhatWasStopped
    LaptopUntouched
    NoApplyOutsideFence
    AbandonRestores
    NoLeak
PROPERTY
    CheckoutSettles
CHECK_DEADLOCK FALSE
