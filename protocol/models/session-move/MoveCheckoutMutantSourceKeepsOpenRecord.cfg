\* expect-violation: ClosedEmptyScopeTakesTheNextName
\* The retry of an attach for an unserved name frees the scope on the executor, as
\* CloseReboundUnserved says, but the source's own record still shows an attach
\* with no close, because the retry was a rebound attach and the source cannot
\* tell that the host closed the scope. The corrected name is attached at that
\* incarnation, the executor says the scope is already there, and the source asks
\* how the close ended under the corrected name. The executor judges a close by
\* workspace first and refuses, so the corrected name is refused for a scope that
\* is closed and holds no tree. This is the source before LearnsUnderBound: the
\* live re-drive of 2026-11-17 saw it, and the advice (name the bound workspace
\* again) is what made the source learn the close.
SPECIFICATION Spec2
CONSTANTS
    IntendDurable = TRUE
    AbortGuardsSent = TRUE
    RetireObserves = TRUE
    RefuseUncommitted = TRUE
    MaxInc = 7
    MaxCrashes = 0
    HoldsRule = "applied"
    BaseAhead = TRUE
    CellChecksOp = TRUE
    FenceApply = TRUE
    CaptureLeavesLaptop = FALSE
    OperatorAbandon = FALSE
    MaxEdits = 0
    MaxCommits = 8
    MaxAtt = 2
    MaxTok = 7
    MaxReruns = 1
    MaxLost = 1
    InitWs = {"unknown"}
    RebindClosedUnused = TRUE
    CloseFailedAttach = TRUE
    MismatchRefused = TRUE
    RebindOpen = FALSE
    OwnerDiesInAttach = TRUE
    CloseReboundUnserved = TRUE
    LearnsUnderBound = FALSE
    CloseFailedTree = TRUE
INVARIANTS
    ClosedEmptyScopeTakesTheNextName
CHECK_DEADLOCK FALSE
