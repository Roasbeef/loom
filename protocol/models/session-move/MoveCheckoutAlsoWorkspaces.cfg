\* A second clean configuration: the checkout's workspace is configured wrongly
\* at the start, as a `shared` workspace (the apply is refused) or a name the
\* executor does not serve (the attach fails), and the operator corrects it.
\* The ledger lets the corrected attach rebind the scope the failed one left.
\* TLC must find no violation. The directory is not edited, so the range stays
\* small; MoveCheckout.cfg covers the edits and the retry.
\*
\* MaxCrashes is 0 on purpose. With 1 this configuration violates NoLeak: a source
\* that dies in a landing for the `shared` workspace leaves the scope open, which
\* is the case MoveCheckoutMutantCrashInLanding records.
SPECIFICATION Spec2
CONSTANTS
    IntendDurable = TRUE
    AbortGuardsSent = TRUE
    RetireObserves = TRUE
    RefuseUncommitted = TRUE
    MaxInc = 7
    MaxCrashes = 0
    HoldsRule = "applied"
    BaseAhead = TRUE
    CellChecksOp = TRUE
    FenceApply = TRUE
    CaptureLeavesLaptop = FALSE
    OperatorAbandon = FALSE
    MaxEdits = 0
    MaxCommits = 8
    MaxAtt = 2
    MaxTok = 7
    MaxReruns = 1
    MaxLost = 1
    InitWs = {"shared", "unknown"}
    RebindClosedUnused = TRUE
    CloseFailedAttach = TRUE
    MismatchRefused = TRUE
    RebindOpen = FALSE
INVARIANTS
    TypeOK2
    OneOwner
    NoResurrection
    ActiveImpliesComplete
    OneServingHolder
    CheckoutIsWhatWasStopped
    LaptopUntouched
    NoApplyOutsideFence
    AbandonRestores
    NoLeak
    OpenScopeKeepsWorkspace
PROPERTY
    CheckoutSettles
CHECK_DEADLOCK FALSE
