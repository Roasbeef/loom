\* expect-violation: NoLeak
\* An attach for a name the executor does not serve is handled by an executor whose
\* build dies at the owner link before the workspace is checked, and the source
\* dies with it. The ledger holds an open scope bound to the name and no plane. The
\* retry is a rebound attach, which the host leaves open, so nothing frees the
\* scope. The operator corrects the name, the attach is refused for the open
\* scope's workspace, and the move is abandoned with the scope still open, which
\* NoLeak names. This is the host before CloseReboundUnserved.
SPECIFICATION Spec2
CONSTANTS
    IntendDurable = TRUE
    AbortGuardsSent = TRUE
    RetireObserves = TRUE
    RefuseUncommitted = TRUE
    MaxInc = 7
    MaxCrashes = 0
    HoldsRule = "applied"
    BaseAhead = TRUE
    CellChecksOp = TRUE
    FenceApply = TRUE
    CaptureLeavesLaptop = FALSE
    OperatorAbandon = FALSE
    MaxEdits = 0
    MaxCommits = 8
    MaxAtt = 2
    MaxTok = 7
    MaxReruns = 1
    MaxLost = 1
    InitWs = {"unknown"}
    RebindClosedUnused = TRUE
    CloseFailedAttach = TRUE
    MismatchRefused = TRUE
    RebindOpen = FALSE
    OwnerDiesInAttach = TRUE
    CloseReboundUnserved = FALSE
INVARIANTS
    NoLeak
CHECK_DEADLOCK FALSE
