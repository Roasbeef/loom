\* expect-violation: FailedBuildHoldsNoScope
\* The same attach, on the host before CloseFailedTree: the scope the attach
\* admitted is left open when the worktree cannot be made. The orchestrator ends a
\* session that was refused as final and no one closes a scope it holds no plane
\* for, so the scope counts against the executor's limit for good. This is what
\* the drive of issue #1137 found with eight executors at a limit of one.
SPECIFICATION Spec2
CONSTANTS
    IntendDurable = TRUE
    AbortGuardsSent = TRUE
    RetireObserves = TRUE
    RefuseUncommitted = TRUE
    MaxInc = 7
    MaxCrashes = 0
    HoldsRule = "applied"
    BaseAhead = TRUE
    CellChecksOp = TRUE
    FenceApply = TRUE
    CaptureLeavesLaptop = FALSE
    OperatorAbandon = FALSE
    MaxEdits = 0
    MaxCommits = 8
    MaxAtt = 2
    MaxTok = 7
    MaxReruns = 1
    MaxLost = 1
    InitWs = {"badtree"}
    RebindClosedUnused = TRUE
    CloseFailedAttach = TRUE
    MismatchRefused = TRUE
    RebindOpen = FALSE
    OwnerDiesInAttach = FALSE
    CloseReboundUnserved = TRUE
    CloseFailedTree = FALSE
INVARIANTS
    FailedBuildHoldsNoScope
CHECK_DEADLOCK FALSE
