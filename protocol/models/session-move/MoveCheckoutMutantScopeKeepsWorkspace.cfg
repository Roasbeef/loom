\* expect-violation: AbandonRestores
\* The shipped ledger binds a scope to the first workspace an attach names and
\* keeps the binding when the landing fails. The configured workspace is a
\* `shared` one, so the apply is refused and the move is abandoned, and the
\* closed scope stays bound to it. The operator corrects the configuration, and
\* the corrected workspace is blocked by the scope the failed attempt left.
SPECIFICATION Spec2
CONSTANTS
    IntendDurable = TRUE
    AbortGuardsSent = TRUE
    RetireObserves = TRUE
    RefuseUncommitted = TRUE
    MaxInc = 7
    MaxCrashes = 1
    HoldsRule = "applied"
    BaseAhead = TRUE
    CellChecksOp = TRUE
    FenceApply = TRUE
    CaptureLeavesLaptop = FALSE
    OperatorAbandon = FALSE
    MaxEdits = 2
    MaxCommits = 8
    MaxAtt = 2
    MaxTok = 7
    MaxReruns = 1
    MaxLost = 1
    InitWs = {"shared"}
    RebindClosedUnused = FALSE
    CloseFailedAttach = FALSE
    MismatchRefused = FALSE
    RebindOpen = FALSE
INVARIANTS
    AbandonRestores
CHECK_DEADLOCK FALSE
