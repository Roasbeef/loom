\* expect-violation: NoLeak
\* Not a rule turned off: the case the ruled rules leave. The workspace is a
\* `shared` one, so the attach succeeds and the apply is refused, and the source
\* dies after the attach and before it closes the scope. The scope is open and
\* bound to that workspace. The operator corrects the name, and the move is
\* refused for the open scope's workspace and abandoned, with the scope still
\* open. The refusal names the workspace. The way out is to name the bound
\* workspace again so the move closes the scope, then to correct the name.
\* `loom executor release` refuses an open scope, so it does not free it.
\*
\* The same crash after an attach for a name the executor does not serve leaves
\* nothing open: the host closes that scope itself. What it leaves is a source
\* record without the close, which the model has no cell to show; the checkout
\* test `a_close_asked_under_the_corrected_workspace_ends_the_move_test` does.
SPECIFICATION Spec2
CONSTANTS
    IntendDurable = TRUE
    AbortGuardsSent = TRUE
    RetireObserves = TRUE
    RefuseUncommitted = TRUE
    MaxInc = 7
    MaxCrashes = 1
    HoldsRule = "applied"
    BaseAhead = TRUE
    CellChecksOp = TRUE
    FenceApply = TRUE
    CaptureLeavesLaptop = FALSE
    OperatorAbandon = FALSE
    MaxEdits = 0
    MaxCommits = 8
    MaxAtt = 2
    MaxTok = 7
    MaxReruns = 1
    MaxLost = 1
    InitWs = {"shared"}
    RebindClosedUnused = TRUE
    CloseFailedAttach = TRUE
    MismatchRefused = TRUE
    RebindOpen = FALSE
INVARIANTS
    NoLeak
CHECK_DEADLOCK FALSE
