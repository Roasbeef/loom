\* expect-violation: LaptopUntouched
\* The capture commits its snapshot into the laptop's own repository, so the
\* directory's HEAD moves. The shipped capture builds the snapshot in a private
\* stage and writes nothing to the directory.
SPECIFICATION Spec2
CONSTANTS
    IntendDurable = TRUE
    AbortGuardsSent = TRUE
    RetireObserves = TRUE
    RefuseUncommitted = TRUE
    MaxInc = 7
    MaxCrashes = 1
    HoldsRule = "applied"
    BaseAhead = TRUE
    CellChecksOp = TRUE
    FenceApply = TRUE
    CaptureLeavesLaptop = TRUE
    OperatorAbandon = FALSE
    MaxEdits = 2
    MaxCommits = 8
    MaxAtt = 2
    MaxTok = 7
    MaxReruns = 1
    MaxLost = 1
    InitWs = {"good"}
    RebindClosedUnused = TRUE
    CloseFailedAttach = TRUE
    MismatchRefused = TRUE
    RebindOpen = FALSE
INVARIANTS
    LaptopUntouched
CHECK_DEADLOCK FALSE
