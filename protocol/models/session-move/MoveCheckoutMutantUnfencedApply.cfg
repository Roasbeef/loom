\* expect-violation: NoApplyOutsideFence
\* The executor applies any request while a scope is open, without judging the
\* incarnation and token first. A request that a crashed run left in flight
\* lands under the scope that a later run attached.
SPECIFICATION Spec2
CONSTANTS
    IntendDurable = TRUE
    AbortGuardsSent = TRUE
    RetireObserves = TRUE
    RefuseUncommitted = TRUE
    MaxInc = 7
    MaxCrashes = 1
    HoldsRule = "applied"
    BaseAhead = TRUE
    CellChecksOp = TRUE
    FenceApply = FALSE
    CaptureLeavesLaptop = FALSE
    OperatorAbandon = FALSE
    MaxEdits = 2
    MaxCommits = 8
    MaxAtt = 2
    MaxTok = 7
    MaxReruns = 1
    MaxLost = 1
    InitWs = {"good"}
    RebindUnused = TRUE
INVARIANTS
    NoApplyOutsideFence
CHECK_DEADLOCK FALSE
