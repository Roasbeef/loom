\* expect-violation: CheckoutSettles
\* The same defect with a workspace name the executor does not serve. The
\* attach binds a scope to the name and then fails, so the mover stalls with the
\* scope open. The operator, who is fair here, corrects the configuration and
\* restarts the daemon, and the move still never settles: the corrected attach is
\* refused for the workspace, the refusal reads as a lost connection, and a
\* daemon that decides by catalogue rows has no abandon on request.
SPECIFICATION Spec2
CONSTANTS
    IntendDurable = TRUE
    AbortGuardsSent = TRUE
    RetireObserves = TRUE
    RefuseUncommitted = TRUE
    MaxInc = 7
    MaxCrashes = 1
    HoldsRule = "applied"
    BaseAhead = TRUE
    CellChecksOp = TRUE
    FenceApply = TRUE
    CaptureLeavesLaptop = FALSE
    OperatorAbandon = FALSE
    MaxEdits = 0
    MaxCommits = 8
    MaxAtt = 2
    MaxTok = 7
    MaxReruns = 1
    MaxLost = 1
    InitWs = {"unknown"}
    RebindClosedUnused = FALSE
    CloseFailedAttach = FALSE
    MismatchRefused = FALSE
    RebindOpen = FALSE
PROPERTY
    CheckoutSettles
CHECK_DEADLOCK FALSE
