\* expect-violation: NoResurrection
\* A source that finds the record gone reverts and serves the session again.
SPECIFICATION Spec
CONSTANTS
    RevokeFirst = TRUE
    ActivateExpects = TRUE
    AbandonExpects = TRUE
    ImportAfterCAS = TRUE
    ReceiverChecksRow = TRUE
    RefuseOnlyOthers = TRUE
    RetireConsistent = TRUE
    RetireOnAnswer = TRUE
    GoneSetsAside = FALSE
    MaxInc = 3
    MaxVer = 2
    MaxCrashes = 2
    MaxQuorumLosses = 1
INVARIANTS
    NoResurrection
CHECK_DEADLOCK FALSE
