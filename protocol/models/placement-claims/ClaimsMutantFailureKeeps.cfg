\* expect-violation: NoLeakedClaim
\* A claim is not released when its builder fails. The failed session keeps
\* counting toward its executor for as long as the entry stays in the table.
SPECIFICATION Spec
CONSTANTS
    NExec = 2
    NSess = 2
    AtomicRead = TRUE
    OneTurn = TRUE
    CountsRunning = FALSE
    FailureKeeps = TRUE
    Down = {}
    Bound = 1
    MaxRetry = 0
    MaxRestarts = 0
INVARIANTS
    NoLeakedClaim
CHECK_DEADLOCK FALSE
