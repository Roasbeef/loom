\* expect-violation: NoRoomNeverFinal
\* R1 removed, the others kept: a no-room failure still ends the row, so an
\* ask that is polling the session finds it gone.
SPECIFICATION Spec
CONSTANTS
    RetryInPlace = FALSE
    BareAsksAgain = TRUE
    AnswerNotSilent = TRUE
    KeepsFinal = TRUE
    FinalReleases = TRUE
    RetryMakesNew = FALSE
    LostFailure = FALSE
    Broken = FALSE
    MaxMade = 3
INVARIANTS
    NoRoomNeverFinal
CHECK_DEADLOCK FALSE
