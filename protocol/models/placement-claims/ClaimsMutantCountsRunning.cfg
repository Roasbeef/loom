\* expect-violation: ClaimCountedOnce
\* A claim keeps counting after its slot is running. The session is then
\* counted twice, once as a claim and once as an open scope, and the pool
\* reads as fuller than it is.
SPECIFICATION Spec
CONSTANTS
    NExec = 2
    NSess = 2
    AtomicRead = TRUE
    OneTurn = TRUE
    CountsRunning = TRUE
    FailureKeeps = FALSE
    Down = {}
    Bound = 1
    MaxRetry = 0
    MaxRestarts = 0
INVARIANTS
    ClaimCountedOnce
CHECK_DEADLOCK FALSE
