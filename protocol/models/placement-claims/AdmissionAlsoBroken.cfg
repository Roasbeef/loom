\* The clean rules with a child whose every build fails for a reason no later
\* ask can change. The two asks still interleave freely. TLC must find no
\* violation: at most two builds are started (one for each asker, since the
\* tool's ask after the drain ended the row makes a new one, and no
\* registration is built twice), the stub learns the refusal, and once the
\* tool has heard it nothing is left for the child. The catalogue keeps every
\* failure here: a failure it did not keep is a bare reservation, which the
\* next ask builds again (R2), so that case has no bound on builds.
SPECIFICATION Spec
CONSTANTS
    RetryInPlace = TRUE
    BareAsksAgain = TRUE
    AnswerNotSilent = TRUE
    KeepsFinal = TRUE
    FinalReleases = TRUE
    RetryMakesNew = FALSE
    LostFailure = FALSE
    Broken = TRUE
    MaxMade = 3
INVARIANTS
    TypeOK
    OneSessionPerChild
    NothingHeldUnplaced
    BuildsBoundedWhenBroken
PROPERTY
    RefusedWhenBroken
CHECK_DEADLOCK FALSE
