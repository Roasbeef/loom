\* expect-violation: Balanced
\* The burst race that PR #1185 fixed: the count and the ordering are one step
\* and the record of the choice is another. Opens that run together all read
\* the same counts, all pick the same executor, and the pool is not spread.
SPECIFICATION Spec
CONSTANTS
    NExec = 2
    NSess = 2
    AtomicRead = TRUE
    OneTurn = FALSE
    CountsRunning = FALSE
    FailureKeeps = FALSE
    Down = {}
    Bound = 1
    MaxRetry = 0
    MaxRestarts = 0
INVARIANTS
    Balanced
CHECK_DEADLOCK FALSE
