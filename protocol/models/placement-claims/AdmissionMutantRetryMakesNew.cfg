\* expect-violation: OneSessionPerChild
\* R1 done wrongly: the repeat ask makes a new reservation for the child, as
\* a first ask does, instead of building the one its row names again. The old
\* registration stays beside the new one.
SPECIFICATION Spec
CONSTANTS
    RetryInPlace = TRUE
    BareAsksAgain = TRUE
    AnswerNotSilent = TRUE
    FinalReleases = TRUE
    RetryMakesNew = TRUE
    LostFailure = FALSE
    MaxMade = 3
INVARIANTS
    OneSessionPerChild
CHECK_DEADLOCK FALSE
