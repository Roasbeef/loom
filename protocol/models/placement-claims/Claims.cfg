\* The clean model: the open scopes are counted in the registry's turn, with the
\* claims, and every rule is on. TLC must find no violation. The shipped code
\* counts the open scopes before the turn; ClaimsMutantReadOutsideTurn.cfg is that.
SPECIFICATION Spec
CONSTANTS
    NExec = 2
    NSess = 3
    AtomicRead = TRUE
    OneTurn = TRUE
    CountsRunning = FALSE
    FailureKeeps = FALSE
    Down = {}
    Bound = 1
    MaxRetry = 1
    MaxRestarts = 1
INVARIANTS
    TypeOK
    Balanced
    ClaimCountedOnce
    NoLeakedClaim
PROPERTY
    OpensSettle
CHECK_DEADLOCK FALSE
