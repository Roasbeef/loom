\* expect-violation: BuildsBoundedWhenBroken
\* KeepsFinal removed: a repeat ask rebuilds a reservation whose kept failure
\* is final, as the first push of this branch (18bafa5c2) did. An ask that
\* polls while the failed slot drains reads stopping and asks again, the next
\* ask builds again, and the build clears the kept reason.
SPECIFICATION Spec
CONSTANTS
    RetryInPlace = TRUE
    BareAsksAgain = TRUE
    AnswerNotSilent = TRUE
    KeepsFinal = FALSE
    FinalReleases = TRUE
    RetryMakesNew = FALSE
    LostFailure = FALSE
    Broken = TRUE
    MaxMade = 3
INVARIANTS
    BuildsBoundedWhenBroken
CHECK_DEADLOCK FALSE
