\* expect-violation: NothingHeldUnplaced
\* A final refusal does not end the child's session
\* (`spawn_seed.ended_unless_asks_again` removed), over the code that can
\* still answer one (R1 off). The sender stops asking and the reservation is
\* left with its row.
SPECIFICATION Spec
CONSTANTS
    RetryInPlace = FALSE
    BareAsksAgain = TRUE
    AnswerNotSilent = TRUE
    FinalReleases = FALSE
    RetryMakesNew = FALSE
    LostFailure = FALSE
    MaxMade = 3
INVARIANTS
    NothingHeldUnplaced
CHECK_DEADLOCK FALSE
