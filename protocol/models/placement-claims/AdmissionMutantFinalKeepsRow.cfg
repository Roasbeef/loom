\* expect-violation: NothingHeldUnplaced
\* A final refusal does not end the child's session
\* (`spawn_seed.ended_unless_asks_again` removed), with every other rule on and
\* a child whose build fails for a final reason. The tool hears the refusal and
\* stops, and the reservation is left with its row.
SPECIFICATION Spec
CONSTANTS
    RetryInPlace = TRUE
    BareAsksAgain = TRUE
    AnswerNotSilent = TRUE
    KeepsFinal = TRUE
    FinalReleases = FALSE
    RetryMakesNew = FALSE
    LostFailure = FALSE
    Broken = TRUE
    MaxMade = 2
INVARIANTS
    NothingHeldUnplaced
CHECK_DEADLOCK FALSE
