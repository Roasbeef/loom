\* The clean model: a repeat ask rebuilds the child's reservation (R1), a bare
\* reservation asks again (R2), and a NotYetOpen answer does not keep the drain
\* from joining (R3). The catalogue may fail to keep one start failure. TLC
\* must find no violation, and the child must be placed.
SPECIFICATION Spec
CONSTANTS
    RetryInPlace = TRUE
    BareAsksAgain = TRUE
    AnswerNotSilent = TRUE
    FinalReleases = TRUE
    RetryMakesNew = FALSE
    LostFailure = TRUE
    MaxMade = 2
INVARIANTS
    TypeOK
    NoRoomNeverFinal
    OneSessionPerChild
    NothingHeldUnplaced
PROPERTY
    PlacedOnceRoomFrees
CHECK_DEADLOCK FALSE
