\* The clean model: a repeat ask rebuilds the child's reservation (R1) unless
\* its kept failure is final, a bare reservation asks again (R2), and a
\* NotYetOpen answer does not keep the drain from joining (R3). Every build
\* fails only for want of room, and the catalogue may fail to keep one start
\* failure. TLC must find no violation, and the child must be placed.
\* AdmissionAlsoBroken.cfg is the same rules with a final failure.
SPECIFICATION Spec
CONSTANTS
    RetryInPlace = TRUE
    BareAsksAgain = TRUE
    AnswerNotSilent = TRUE
    KeepsFinal = TRUE
    FinalReleases = TRUE
    RetryMakesNew = FALSE
    LostFailure = TRUE
    Broken = FALSE
    MaxMade = 2
INVARIANTS
    TypeOK
    NoRoomNeverFinal
    OneSessionPerChild
    NothingHeldUnplaced
PROPERTY
    PlacedOnceRoomFrees
CHECK_DEADLOCK FALSE
