\* expect-violation: ClaimCountedOnce
\* The code before the read moved into the turn: the open scopes are counted by the caller before the
\* registry's turn (`daemon/main.gleam` passes `resident_by_name(...)` as an
\* argument), and only the claims are read in the turn. A session whose slot
\* becomes resident between the two has dropped out of the claims and is not in
\* the count that was read, so the ask counts it not at all.
SPECIFICATION Spec
CONSTANTS
    NExec = 2
    NSess = 2
    AtomicRead = FALSE
    OneTurn = TRUE
    CountsRunning = FALSE
    FailureKeeps = FALSE
    Down = {}
    Bound = 1
    MaxRetry = 0
    MaxRestarts = 0
INVARIANTS
    ClaimCountedOnce
CHECK_DEADLOCK FALSE
