\* expect-violation: PlacedOnceRoomFrees
\* R3 removed, the others kept: the drain's spawn step hears NotYetOpen as
\* silence and skips the join, which is the only thing that frees a scope
\* while the parent waits in the spawn tool. The other child finishes, its
\* scope is never collected, and the child is never placed. This is runs D3
\* and D6 within the tool's window.
SPECIFICATION Spec
CONSTANTS
    RetryInPlace = TRUE
    BareAsksAgain = TRUE
    AnswerNotSilent = FALSE
    FinalReleases = TRUE
    RetryMakesNew = FALSE
    LostFailure = FALSE
    MaxMade = 2
PROPERTY
    PlacedOnceRoomFrees
CHECK_DEADLOCK FALSE
