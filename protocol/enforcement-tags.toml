# The enforcement tag vocabulary: the strings the Go helper (packages/sandbox)
# writes into `hello.features` and `exec_exit.enforcement`, and the Gleam
# broker (packages/broker/src/broker/exec.gleam) reads back to decide whether
# a result satisfies an enforcement demand.
#
# This file is the single source. `make gen-tags` renders it into
#
#   packages/sandbox/internal/jail/tags_gen.go   (Go constants)
#   packages/broker/src/broker/tags.gleam        (Gleam constants)
#
# and `make tags-check` fails when either output, or this file, has moved
# without the other. Both outputs are DO NOT EDIT: change a spelling here.
#
# A tag names a *layer*. One spelling can play several roles, and `kinds`
# says which ones the helper actually emits it in:
#
#   feature  appears in the hello frame's `features` list
#   applied  appears as a bare or detailed entry of `enforcement` (the
#            detail, when there is one, follows a prefix below)
#   skip     opens the text after `skip:` in an `enforcement` entry
#
# `platforms` is a subset of linux, darwin, other ("other" is every GOOS
# the helper has no jail for). `meaning` is one line; it becomes the doc
# comment on the generated constant.

[[tag]]
id = "rlimits"
kinds = ["feature"]
platforms = ["linux", "darwin", "other"]
meaning = "Per-process resource ceilings; needs no kernel opt-in, so always advertised."

[[tag]]
id = "pgroup"
kinds = ["feature"]
platforms = ["linux", "darwin", "other"]
meaning = "Each execution gets its own session and process group, signalled as a unit."

[[tag]]
id = "degraded"
kinds = ["feature"]
platforms = ["linux", "darwin", "other"]
meaning = "The strongest platform jail (bwrap or Seatbelt) is unavailable on this host."

[[tag]]
id = "platform-unsupported"
kinds = ["feature"]
platforms = ["other"]
meaning = "The build has no jail for its operating system at all; worse than degraded."

[[tag]]
id = "bwrap"
kinds = ["feature", "applied", "skip"]
platforms = ["linux"]
meaning = "Bubblewrap namespaces and mount plan; applied only once stage 2 has reported from inside."

[[tag]]
id = "landlock"
kinds = ["feature", "applied", "skip"]
platforms = ["linux"]
meaning = "Landlock filesystem rules, the second filesystem layer and the first in degraded mode."

[[tag]]
id = "seccomp"
kinds = ["feature", "skip"]
platforms = ["linux"]
meaning = "Seccomp-filter support; the applied form is seccomp-net."

[[tag]]
id = "cgroup-v2"
kinds = ["feature", "applied", "skip"]
platforms = ["linux"]
meaning = "A per-execution cgroup v2 group holding the memory and process ceilings."

[[tag]]
id = "seatbelt"
kinds = ["feature", "applied", "skip"]
platforms = ["darwin"]
meaning = "The macOS Seatbelt profile (sandbox-exec) entered around the execution."

[[tag]]
id = "mounts"
kinds = ["applied", "skip"]
platforms = ["linux"]
meaning = "The audited mount plan: applied carries counts and a plan digest, skipped names a widened path."

[[tag]]
id = "no-new-privs"
kinds = ["applied", "skip"]
platforms = ["linux"]
meaning = "PR_SET_NO_NEW_PRIVS: no privilege gain through setuid binaries or file capabilities."

[[tag]]
id = "seccomp-net"
kinds = ["applied"]
platforms = ["linux"]
meaning = "A seccomp filter denying direct sockets under network off and proxy policies."

[[tag]]
id = "seatbelt-fs"
kinds = ["applied"]
platforms = ["darwin"]
meaning = "The Seatbelt filesystem plan, with root counts and a plan digest."

[[tag]]
id = "seatbelt-net"
kinds = ["applied"]
platforms = ["darwin"]
meaning = "Seatbelt denial of direct network access under network off and proxy policies."

[[tag]]
id = "rlimit-fsize"
kinds = ["applied"]
platforms = ["linux", "darwin"]
meaning = "RLIMIT_FSIZE ceiling on the size of any file the execution writes."

[[tag]]
id = "rlimit-cpu"
kinds = ["applied"]
platforms = ["linux", "darwin"]
meaning = "RLIMIT_CPU ceiling on CPU seconds."

[[tag]]
id = "rlimit-address-space"
kinds = ["applied", "skip"]
platforms = ["darwin"]
meaning = "RLIMIT_AS ceiling standing in for the memory limit, where the kernel accepts one."

[[tag]]
id = "rlimit-processes"
kinds = ["applied", "skip"]
platforms = ["darwin"]
meaning = "RLIMIT_NPROC ceiling standing in for the process limit; per-user, not per-execution."

[[tag]]
id = "darwin-process-lifecycle"
kinds = ["skip"]
platforms = ["darwin"]
meaning = "The one containment property Seatbelt cannot give: no PID namespace or subreaper."

[[tag]]
id = "stage2"
kinds = ["skip"]
platforms = ["linux", "darwin"]
meaning = "Stage 2 sent no enforcement report, so its in-process layers cannot be confirmed."

[[tag]]
id = "network-proxy"
kinds = ["skip"]
platforms = ["linux", "darwin", "other"]
meaning = "Proxy-mode network policy: direct network was disabled but the allowlist was not enforced."

[[tag]]
id = "platform-restrictions"
kinds = ["skip"]
platforms = ["other"]
meaning = "Stage 2 has no in-process driver for this operating system."

[[tag]]
id = "jail"
kinds = ["skip"]
platforms = ["other"]
meaning = "Opens the platform-unsupported reason: this build has no sandbox for its OS."

# A prefix is the separator that ends a tag and starts its detail. The
# broker reads a layer name as the text up to the first ":" or "=", so a
# prefix is only ever matched through its tag; these constants exist so the
# helper's writers and the broker's `skip:` tests spell the separator once.

[[prefix]]
id = "skip"
value = "skip:"
meaning = "Marks an enforcement entry as a layer that was NOT applied; the rest is the layer tag and a reason."

[[prefix]]
id = "landlock-abi"
value = "landlock:abi="
meaning = "Landlock applied entry; the number that follows is the kernel ABI version."

[[prefix]]
id = "mounts-report"
value = "mounts:"
meaning = "Mount-audit applied entry; comma-separated counts and a plan digest follow."

[[prefix]]
id = "seatbelt-fs-report"
value = "seatbelt-fs:"
meaning = "Seatbelt filesystem applied entry; comma-separated counts and a plan digest follow."
