# gopls as a Loom language profile (ADR-014). The [lsp.go] table is
# exactly what `loom.toml` would carry; installing this extension
# approves it, and `loom ext check lsp_go` proves it against the module
# in fixture/.
[extension]
name = "lsp_go"
version = "0.1.0"
description = "gopls for Loom's language-server tools"
license = "Apache-2.0"
tier = "profile"

# gopls writes nothing into the project, so the project stays read-only.
# It loads packages by running `go list`, and `go` is found on the
# daemon's PATH; its own GOROOT must be readable in the jail, which it is
# under /usr, /opt or Homebrew's prefix and is not in a toolchain cache
# elsewhere (see README.md).
[lsp.go]
command = ["gopls"]
extensions = [".go"]
root_markers = ["go.mod"]

# The module cache: a module with requirements has their sources here,
# and `go list` reads them. The fixture has none, so its checks pass
# without it; any real module needs it.
readable = ["~/go/pkg/mod"]

# The caches, private to this server. `go list` must be able to write a
# build cache or it loads no packages at all and every question comes
# back not found, and it must not be the host's own: the host's
# `go build` trusts GOCACHE without verifying it, and `go list` in the
# jail runs cgo with the project's `#cgo` flags, which the model can
# write. So the build cache is Loom's, never ~/.cache/go-build.
# GOCACHE points `go` at <cache>/loom/lsp/go/go-build and GOPLSCACHE
# points gopls's own file cache at <cache>/loom/lsp/go/gopls; Loom creates
# each and grants it writable. Both are named rather than left to follow
# XDG_CACHE_HOME, because Go and gopls read XDG_CACHE_HOME on Linux only:
# on macOS their defaults are under ~/Library/Caches, which the jail does
# not grant. XDG_CACHE_HOME stays, at <cache>/loom/lsp/go/xdg, for the
# other tools gopls runs that read it (goimports keeps a cache there). The
# three are siblings, since a cache inside another is refused. The
# directories outlive a session, so only the first query on a host starts
# cold.
cache_env = { XDG_CACHE_HOME = "xdg", GOCACHE = "go-build", GOPLSCACHE = "gopls" }

# GOFLAGS carries an operator's build tags and -mod mode, without which
# gopls would load a different package set than their build does.
env = ["GOFLAGS"]

# Appended once to lsp_definition's description, in sessions that
# configure this server, so the model qualifies a name as the resolver
# splits it.
hint = "Qualify a name with its package name as imported: util.Greet"

# A qualified name, found by searching the module and narrowed by the
# package directory the qualifier names.
[[check]]
server = "go"
query = "definition"
symbol = "util.Greet"
expect = ["util/util.go:4"]

# Every reference across both packages: the declaration, two calls on one
# line of main.go, and one on the next.
[[check]]
server = "go"
query = "references"
symbol = "util.Greet"
expect = ["util/util.go:4", "main.go:6", "main.go:7"]
