# Override for compose.yaml: run the executor in the full-isolation posture of
# docs/docker.md, so loom's own jail (bubblewrap, Landlock, seccomp, cgroup v2
# ceilings) comes up inside the container instead of Docker's boundary being
# the only one.
#
#   docker compose -f docker/distributed/compose.yaml \
#                  -f docker/distributed/compose.isolated.yaml up -d
#
# Only the executor needs this. The orchestrator runs no model-written code,
# so it stays in the plain posture.
#
# These settings remove pieces of Docker's own confinement; read "Full
# isolation" in docs/docker.md for what each one gives up before using them.
# They are the flags of that page with one change: the executor keeps a
# private cgroup namespace (docs/docker.md uses --cgroupns=host). Its
# /sys/fs/cgroup is then the container's own cgroup, so the entrypoint carves
# the delegated base out of that and the host's cgroup tree is never written.
# The entrypoint refuses to start if the container shares the host's.

services:
  executor:
    cgroup: private
    cap_add: [SYS_ADMIN]
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    environment:
      LOOM_CGROUP_DELEGATE: "1"
