# loom-baseten.toml registers the open-source Baseten models used by the
# local pi and Prime Agent clients. The server reads the credential from
# BASETEN_API_KEY only when it dispatches a request.

[models.baseten-kimi-k3]
dialect = "openai"
base_url = "https://inference.baseten.co/v1"
api_key_env = "BASETEN_API_KEY"
model_id = "moonshotai/Kimi-K3"
# Probed blind (issue #358): an image_url block returns empty content.
vision = false
context_window = 1048576
max_output_tokens = 32768
# Kimi reasons internally, but this endpoint does not accept the
# OpenAI reasoning_effort field.
thinking = "unsupported"

[models.baseten-deepseek-v4-flash]
dialect = "openai"
base_url = "https://inference.baseten.co/v1"
api_key_env = "BASETEN_API_KEY"
model_id = "deepseek-ai/DeepSeek-V4-Flash-0731"
context_window = 1048576
max_output_tokens = 262144
# DeepSeek reasons internally, but this endpoint does not accept the
# OpenAI reasoning_effort field.
thinking = "unsupported"

[models.baseten-glm-5-3]
dialect = "openai"
base_url = "https://inference.baseten.co/v1"
api_key_env = "BASETEN_API_KEY"
model_id = "zai-org/GLM-5.3"
# Probed blind (issue #358): an image_url block is accepted and answered
# as unseen. Image turns on this entry route through the vision role.
vision = false
context_window = 1048576
max_output_tokens = 262144
thinking = "medium"

[models.baseten-glm-5-3-flash]
dialect = "openai"
base_url = "https://inference.baseten.co/v1"
api_key_env = "BASETEN_API_KEY"
model_id = "zai-org/GLM-5.3-Flash"
context_window = 1048576
max_output_tokens = 262144
thinking = "medium"

# Main work favors Kimi and falls back to GLM. Sub-agents favor the two
# faster models, while planning keeps the deeper GLM route. The advisor
# route is optional; naming it starts a second strand that reads what the
# main strand has been doing and answers with one `advise` call. GLM is
# the deeper model here, which is what the job wants: an advisor that
# misjudges is worse than no advisor, and it runs once per run boundary
# rather than once per turn.
[roles]
main = ["baseten-kimi-k3", "baseten-glm-5-3"]
vision = ["baseten-glm-5-3-flash"]
subagent = ["baseten-deepseek-v4-flash", "baseten-glm-5-3-flash"]
plan = ["baseten-glm-5-3"]
summarize = ["baseten-glm-5-3-flash"]
advisor = ["baseten-glm-5-3"]

# What the advisor may look at, how often it is handed a slice of main's
# work, and how long one delivered block quiets the next. All three keys
# are optional and these are the defaults, written out so the shape is
# visible. The tool set is read-only on purpose: a second agent that can
# edit the workspace is a second writer racing the first.
#
# `feed_every_steps` is a floor rather than an interval — see
# `loom-advisor.toml` for what that costs when the advisor is the slower
# model, which here it is.
[advisor]
tools = ["fs_read", "grep"]
feed_every_steps = 20
block_cooldown_reviews = 2

# How a run answers a retryable provider failure. All three keys are
# optional and these are the defaults, written out so the shape is
# visible. Under the default a rate limit is waited out rather than
# failed: `attempts = "unbounded"` keeps asking until the provider
# answers or the run is cancelled. `base_delay_ms` is the first wait
# and `max_delay_ms` is the ceiling that wait doubles towards, so the
# ladder here runs 1s, 2s, 4s and so on up to a minute, then holds
# there. Set `attempts` to a whole number to fail the run instead once
# that many tries are spent.
# [retry]
# attempts = "unbounded"
# base_delay_ms = 1000
# max_delay_ms = 60000
