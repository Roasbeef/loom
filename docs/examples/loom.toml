# loom.toml — an example model catalogue for the session server.
#
#     bin/loomd --session ./session.db --config loom.toml
#
# The catalogue names models and routes roles onto them. Each
# [models.<name>] entry registers one provider endpoint in the gateway;
# the [roles] table gives each role an ordered fallback chain of those
# names. The entry *name* is the handle everything else uses: the TUI's
# /model picker switches a strand by it (`set_config` with
# `model_name`), and it becomes the `provider` half of the durable
# {provider, model_id} identity strands store.
#
# Precedence: --config replaces the LOOM_* environment surface entirely
# (flags > config file > environment > built-in defaults). API keys are
# the exception — they NEVER live in this file. `api_key_env` names an
# environment variable, read only at dispatch time; a missing key still
# boots the server and fails requests in-band.

# An OpenAI-compatible endpoint hosted on Baseten. Baseten speaks the
# chat-completions dialect, so `dialect = "openai"` selects that
# adapter, and `base_url` points at the inference host — either the
# shared root or the dedicated per-model URL your Baseten model page
# shows (this one is a placeholder; substitute your own, e.g.
# https://inference.baseten.co/v1). The bearer key from `api_key_env`
# is the only credential the adapters send; per-model `headers` are not
# supported (a config that sets them is refused, not ignored).
[models.baseten-oss]
dialect = "openai"
base_url = "https://inference.baseten.example/v1"
api_key_env = "BASETEN_API_KEY"
# The id the provider expects in the request body, verbatim.
model_id = "openai/gpt-oss-120b"
# Static model facts. context_window drives overflow detection, so use
# the provider's real figure; max_output_tokens is the default per-turn
# output ceiling.
context_window = 128000
max_output_tokens = 16000
# off | low | medium | high | unsupported. "unsupported" is for models
# with no reasoning mode; like "off" it sends no reasoning field at
# all. Omitting the key means "off".
thinking = "unsupported"

# An Anthropic Messages API endpoint. base_url is omitted, so the
# dialect default (https://api.anthropic.com) applies.
[models.anthropic-opus]
dialect = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
model_id = "claude-opus-5"
context_window = 1000000
max_output_tokens = 32000

# Role routing: which model serves which purpose, best entry first.
# The five routable roles are main, subagent, plan, summarize, and
# vision; only main is required. A later entry is the fallback — used
# when an attempt on the earlier one fails retryably (rate limit,
# transport error), never after a settled response. That walk happens
# inside one attempt, so it costs no retry from the harness's own ladder,
# and the head is always tried first: nothing here tracks health or
# remembers that a model was busy a moment ago.
#
# `main`, `subagent` and `summarize` are dispatched on. `plan` and
# `vision` are reserved: parsed, validated and listed, with no caller in
# the harness yet to route.
[roles]
main = ["baseten-oss", "anthropic-opus"]
subagent = ["baseten-oss"]
summarize = ["anthropic-opus"]

# MCP servers, one [mcp.<name>] table per server. The table key becomes
# the `cap/mcp/<name>` Gleam module code-mode programs import, so it
# must be a single lowercase-ASCII identifier segment ([a-z][a-z0-9_]*)
# — no slashes, no uppercase, no leading digit. `command` is the stdio
# server's argv, executable first. `api_key_env` follows the same rule
# as the model tables: it names a host environment variable, read at
# server spawn and injected into the child environment under the same
# name — the secret value itself NEVER lives in this file. There is no
# CLI flag, no auto-discovery, and no live reload for these tables:
# adding a server is an operator trust decision, made by editing this
# file and restarting the server.
[mcp.github]
command = ["mcp-server-github", "--stdio"]
api_key_env = "GITHUB_TOKEN"

# Triggered project rules, one [[rule]] table per rule. A rule is a
# paragraph of standing instruction that only matters some of the time.
# It costs the model's context NOTHING until something the model itself
# says trips one of its triggers; then the harness injects the body once,
# into the run already in flight, fenced and attributed so it can never
# be mistaken for a turn from the person at the keyboard.
#
# `triggers` are LITERAL, CASE-SENSITIVE substrings — not patterns. Any
# one of them matching fires the rule. They are matched against the
# visible text of settled assistant messages only: not thinking blocks,
# not tool-call arguments, not your own prompts.
#
# A rule fires at most once per strand per session. That is deliberate:
# a rule that re-fired on every match would turn "free while dormant"
# into "unbounded once tripped". The record of what has fired is durable,
# so a crash mid-session does not re-inject on recovery.
#
# Like the MCP tables, these are an operator trust decision: there is no
# CLI flag, no live reload, and no way for a model to add, edit or
# silence one. Editing this file and restarting the server IS the
# decision.
[[rule]]
name = "schema-gate"
triggers = ["migrations/", "ALTER TABLE"]
body = """
Before proposing a migration, run `make check-storage` and paste the
failing rows. The schema gate is not optional.
"""

[[rule]]
name = "no-force-push"
triggers = ["git push --force", "push -f"]
body = "Never force-push a shared branch. Open a new branch instead."

# Scheduled heartbeats, one [[schedule]] table per schedule. Where a rule
# fires on something the model said, a schedule fires on a clock, with
# nobody necessarily present to have prompted it. The injected text is
# fenced and attributed the same way a rule's is, so it can never be
# mistaken for a turn from the person at the keyboard.
#
# A schedule is EITHER recurring (`every`) or one-shot (`at`), never both
# and never neither. `every` is a positive whole number of seconds
# followed by a literal `s` — no five-field cron syntax — and may not go
# below 60s, which would be a busy-loop against provider budget. `at` is
# a quoted RFC3339 UTC timestamp; there is no timezone handling beyond
# UTC. `target` names the strand to fire onto, defaulting to main.
#
# `wake` is where a schedule differs from a rule, and it is opt-in. With
# `wake = false` (the default) a schedule steers a run already in flight
# and holds when the strand is idle, exactly as a rule does. With `wake =
# true` it may START a fresh run on an idle strand — which is the whole
# point of a heartbeat that watches an unattended subagent, and is safe
# to offer only because of the expiry below.
#
# A recurring schedule ALWAYS expires, whether you say so or not. Both
# bounds are always active and the earlier one wins: `max_fires` defaults
# to and caps at 1000, `expires_after_s` defaults to and caps at 604800
# (7 days). That is what stops a `wake = true` schedule keeping a session
# alive — and spending — past a bound you set and can see in this file. A
# one-shot needs neither key and refuses both: it fires once by
# construction.
#
# Each fire is durable and exactly-once: a crash between deciding to fire
# and committing cannot double-fire on restart. A window missed because
# the server was not running coalesces to at most ONE late fire, marked
# as late in the injected text — never a backlog replay of everything
# that was missed.
#
# Unlike the MCP and rule tables, the model can create schedules of its
# own — see the [schedules] table at the bottom of this file. The tables
# here are still yours alone: a model cannot edit, cancel, or even list
# one you wrote.
[[schedule]]
name = "watch-reviewer"
every = "300s"
target = "sub:main/reviewer-abc123"
wake = true
max_fires = 24
body = """
Check on the review subagent. If it has stalled or is repeating itself,
steer it back to the diff and ask for its findings so far.
"""

[[schedule]]
name = "migration-window"
at = "2026-09-01T09:00:00Z"
body = "The migration window opens today. Confirm the plan is ready."


# Whether the model may create schedules of its own, with the
# schedule_create / schedule_list / schedule_cancel tools.
#
#   "wake"  — the DEFAULT, and what you get with no [schedules] table at
#             all. The model may create schedules, including ones that
#             start a fresh run on an idle strand.
#   "steer" — the model may create schedules, but none of them can wake an
#             idle strand: they steer a run already open and hold
#             otherwise, exactly as a triggered [[rule]] does. Choose this
#             if you pay per token and want a model's own reminders to
#             cost nothing while nobody is working.
#   "off"   — no schedule tool is registered at all. The model cannot see
#             the door. Choose this if scheduling should be your decision
#             and nobody else's.
#
# The open default is deliberate, and it rests on a bound rather than on
# trust. A model-created schedule is held to every limit a [[schedule]]
# table above is held to, and it cannot raise any of them: it fires onto
# the strand that created it and no other, it expires on both max_fires
# and expires_after_s with the earlier winning, and one session holds a
# limited number of them at once. So a model can wake itself, and cannot
# wake itself indefinitely — in a session you are running and can stop.
#
# The half-open position was rejected as a default because it is not
# really a feature: a heartbeat exists to fire when nobody is prompting,
# and one that can only steer an open run never fires when it matters.
[schedules]
model_created = "wake"
