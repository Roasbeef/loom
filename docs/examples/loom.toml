# loom.toml — an example model catalogue for the session server.
#
#     bin/loomd --session ./session.db --config loom.toml
#
# The catalogue names models and routes roles onto them. Each
# [models.<name>] entry registers one provider endpoint in the gateway;
# the [roles] table gives each role an ordered fallback chain of those
# names. The entry *name* is the handle everything else uses: the TUI's
# /model picker switches a strand by it (`set_config` with
# `model_name`), and it becomes the `provider` half of the durable
# {provider, model_id} identity strands store.
#
# Precedence: --config replaces the LOOM_* environment surface entirely
# (flags > config file > environment > built-in defaults). API keys are
# the exception — they NEVER live in this file. `api_key_env` names an
# environment variable, read only at dispatch time; a missing key still
# boots the server and fails requests in-band.

# An OpenAI-compatible endpoint hosted on Baseten. Baseten speaks the
# chat-completions dialect, so `dialect = "openai"` selects that
# adapter, and `base_url` points at the inference host — either the
# shared root or the dedicated per-model URL your Baseten model page
# shows (this one is a placeholder; substitute your own, e.g.
# https://inference.baseten.co/v1). The bearer key from `api_key_env`
# is the only credential the adapters send; per-model `headers` are not
# supported (a config that sets them is refused, not ignored).
[models.baseten-oss]
dialect = "openai"
base_url = "https://inference.baseten.example/v1"
api_key_env = "BASETEN_API_KEY"
# The id the provider expects in the request body, verbatim.
model_id = "openai/gpt-oss-120b"
# Static model facts. context_window drives overflow detection, so use
# the provider's real figure; max_output_tokens is the default per-turn
# output ceiling.
context_window = 128000
max_output_tokens = 16000
# off | low | medium | high | unsupported. "unsupported" is for models
# with no reasoning mode; like "off" it sends no reasoning field at
# all. Omitting the key means "off".
thinking = "unsupported"

# An Anthropic Messages API endpoint. base_url is omitted, so the
# dialect default (https://api.anthropic.com) applies.
[models.anthropic-opus]
dialect = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
model_id = "claude-opus-5"
context_window = 1000000
max_output_tokens = 32000

# A Gemini endpoint. `dialect = "gemini"` speaks the generateContent API
# with a Google AI Studio key from `api_key_env`; base_url is omitted, so
# the dialect default (https://generativelanguage.googleapis.com/v1beta)
# applies. Vertex AI is not reachable this way: it wants OAuth, not an
# API key. `thinking` picks the reasoning knob by model generation —
# Gemini 3 takes a level word, Gemini 2.5 a token budget — and "off"
# leaves the model's own default in force rather than disabling it,
# which Gemini 3 cannot do.
[models.gemini-flash]
dialect = "gemini"
api_key_env = "GEMINI_API_KEY"
model_id = "gemini-3.8-flash"
context_window = 1048576
max_output_tokens = 65536
thinking = "low"

# Role routing: which model serves which purpose, best entry first.
# The five routable roles are main, subagent, plan, summarize, and
# vision; only main is required. A later entry is the fallback — used
# when an attempt on the earlier one fails retryably (rate limit,
# transport error), never after a settled response. That walk happens
# inside one attempt, so it costs no retry from the harness's own ladder,
# and the head is always tried first: nothing here tracks health or
# remembers that a model was busy a moment ago.
#
# `main`, `subagent` and `summarize` are dispatched on. `plan` and
# `vision` are reserved: parsed, validated and listed, with no caller in
# the harness yet to route.
[roles]
main = ["baseten-oss", "anthropic-opus"]
subagent = ["baseten-oss", "gemini-flash"]
summarize = ["anthropic-opus"]

# MCP servers, one [mcp.<name>] table per server. The table key becomes
# the `cap/mcp/<name>` Gleam module code-mode programs import, so it
# must be a single lowercase-ASCII identifier segment ([a-z][a-z0-9_]*)
# — no slashes, no uppercase, no leading digit. `command` is the stdio
# server's argv, executable first. `api_key_env` follows the same rule
# as the model tables: it names a host environment variable, read at
# server spawn and injected into the child environment under the same
# name — the secret value itself NEVER lives in this file. There is no
# CLI flag, no auto-discovery, and no live reload for these tables:
# adding a server is an operator trust decision, made by editing this
# file and restarting the server.
[mcp.github]
command = ["mcp-server-github", "--stdio"]
api_key_env = "GITHUB_TOKEN"

# Triggered project rules, one [[rule]] table per rule. A rule is a
# paragraph of standing instruction that only matters some of the time.
# It costs the model's context NOTHING until something the model itself
# says trips one of its triggers; then the harness injects the body once,
# into the run already in flight, fenced and attributed so it can never
# be mistaken for a turn from the person at the keyboard.
#
# `triggers` are LITERAL, CASE-SENSITIVE substrings — not patterns. Any
# one of them matching fires the rule. They are matched against the
# visible text of settled assistant messages only: not thinking blocks,
# not tool-call arguments, not your own prompts.
#
# A rule fires at most once per strand per session. That is deliberate:
# a rule that re-fired on every match would turn "free while dormant"
# into "unbounded once tripped". The record of what has fired is durable,
# so a crash mid-session does not re-inject on recovery.
#
# Like the MCP tables, these are an operator trust decision: there is no
# CLI flag, no live reload, and no way for a model to add, edit or
# silence one. Editing this file and restarting the server IS the
# decision.
[[rule]]
name = "schema-gate"
triggers = ["migrations/", "ALTER TABLE"]
body = """
Before proposing a migration, run `make check-storage` and paste the
failing rows. The schema gate is not optional.
"""

[[rule]]
name = "no-force-push"
triggers = ["git push --force", "push -f"]
body = "Never force-push a shared branch. Open a new branch instead."

# Scheduled heartbeats, one [[schedule]] table per schedule. Where a rule
# fires on something the model said, a schedule fires on a clock, with
# nobody necessarily present to have prompted it. The injected text is
# fenced and attributed the same way a rule's is, so it can never be
# mistaken for a turn from the person at the keyboard.
#
# A schedule sets EXACTLY ONE of three timing keys: `every`, `cron` or
# `at`. Never two, and never none.
#
# `every` is a positive whole number of seconds followed by a literal
# `s`, and may not go below 60s, which would be a busy-loop against
# provider budget. The grid is aligned to the epoch, so `every =
# "86400s"` fires at 00:00 UTC and there is no key that moves it.
#
# `cron` is a standard five-field expression — `minute hour day-of-month
# month day-of-week` — and is how you ask for a time of day or a
# calendar shape that an interval cannot express. Every field takes `*`,
# a number, a range `a-b`, a step `*/n` or `a-b/n`, or a comma-separated
# list of those; day-of-week is 0-7 with 0 and 7 both Sunday. There is no
# seconds field, month and day names such as JAN or MON are not
# understood, and neither are the extensions L, W, ? and #. When BOTH day
# fields are restricted they are ORed rather than ANDed, which is what
# standard cron means and is the one rule that catches everybody out:
# `cron = "0 9 1 * 1"` fires at 09:00 on the first of every month AND at
# 09:00 on every Monday, not only on Mondays that fall on the first.
#
# `at` is a quoted RFC3339 UTC timestamp.
#
# EVERY TIME HERE IS UTC unless a `cron` table says otherwise. Loom
# carries no timezone database and has ruled that it will not, so `cron =
# "0 9 * * 1-5"` on its own is 09:00 UTC on weekdays and a scheduler on
# your machine that speaks local time will disagree with this file by its
# own offset.
#
# `utc_offset` is how you write the local time you actually meant: a
# fixed offset from UTC, `[+-]HH:MM`, between "-14:00" and "+14:00" and
# valid ONLY beside `cron`. `cron = "0 9 * * 1-5"` with `utc_offset =
# "+02:00"` is 09:00 in a UTC+02:00 country, which is 07:00 UTC.
#
# IT IS AN OFFSET AND NOT A TIMEZONE, and the difference will bite you
# twice a year. A zone is a function from an instant to an offset —
# Berlin is +01:00 in January and +02:00 in July — and answering which
# needs the database Loom does not carry. A schedule you write "+02:00"
# in summer keeps firing at that offset all winter, an hour off your own
# clock. Write the offset in force now, say in the body which clock the
# schedule was set for, and edit the table when the offset changes. What
# the offset never touches is the fire history: an occurrence is recorded
# under the UTC second it fell on, so adding or changing an offset
# renames nothing and re-fires nothing.
#
# A cron schedule's first fire is its first match AFTER a running server
# loaded it. A match earlier the same day, before the server came up, was
# never asked for and does not fire — unlike `every`, whose grid has no
# wall-clock meaning and which fires the slot it is created inside.
#
# `target` names the strand to fire onto, defaulting to main.
#
# A schedule aimed at a SUBAGENT strand ends when that subagent's work
# does — the server reads the same record it reaps children by, so a
# heartbeat watching a child stops the moment the child's task settles
# rather than ticking against a strand that has finished. That applies to
# the tables here as well as to anything the model creates.
#
# `wake` is where a schedule differs from a rule, and it is opt-in. With
# `wake = false` (the default) a schedule steers a run already in flight
# and holds when the strand is idle, exactly as a rule does. With `wake =
# true` it may START a fresh run on an idle strand — which is the whole
# point of a heartbeat that watches an unattended subagent, and is safe
# to offer only because of the expiry below.
#
# A recurring schedule — `every` or `cron` alike — ALWAYS expires,
# whether you say so or not. Both bounds are always active and the
# earlier one wins: `max_fires` defaults to and caps at 1000,
# `expires_after_s` defaults to and caps at 604800 (7 days). That is what
# stops a `wake = true` schedule keeping a session alive — and spending —
# past a bound you set and can see in this file. A one-shot needs neither
# key and refuses both: it fires once by construction.
#
# `expires_after_s` is counted from when a running server first loads the
# schedule — from creation, for one the model made — and NOT from its
# first fire. So a schedule that never manages to fire at all still ends
# after its window: one that only steers, on a strand where no run ever
# opens, stops costing anything once the window closes rather than
# waiting for a fire that may never come.
#
# Each fire is durable and exactly-once: a crash between deciding to fire
# and committing cannot double-fire on restart. A window missed because
# the server was not running coalesces to at most ONE late fire, marked
# as late in the injected text — never a backlog replay of everything
# that was missed.
#
# Unlike the MCP and rule tables, the model can create schedules of its
# own — see the [schedules] table at the bottom of this file. The tables
# here are still yours alone: a model cannot edit, cancel, or even list
# one you wrote.
[[schedule]]
name = "watch-reviewer"
every = "300s"
target = "sub:main/reviewer-abc123"
wake = true
max_fires = 24
body = """
Check on the review subagent. If it has stalled or is repeating itself,
steer it back to the diff and ask for its findings so far.
"""

[[schedule]]
name = "weekday-standup"
cron = "0 9 * * 1-5"
utc_offset = "+02:00"
max_fires = 20
body = """
Summarise what is in flight and what is blocked, as a standup note. Keep
it to five lines. This heartbeat was set for 09:00 on a UTC+02:00 clock.
"""

[[schedule]]
name = "migration-window"
at = "2026-09-01T09:00:00Z"
body = "The migration window opens today. Confirm the plan is ready."


# Whether the model may create schedules of its own, with the
# schedule_create / schedule_list / schedule_cancel tools.
#
#   "steer" — the DEFAULT, and what you get with no [schedules] table at
#             all. The model may create schedules, but none of them can
#             wake an idle strand: they steer a run already open and hold
#             otherwise, exactly as a triggered [[rule]] does. A model's
#             own reminders cost nothing while nobody is working, and the
#             session still ends when the work in flight ends.
#   "wake"  — the model may additionally create schedules that start a
#             fresh run on an idle strand. Choose this if you want
#             unattended work checked on with nobody prompting. Know what
#             it permits: expiry is per schedule, so a model woken by one
#             heartbeat can create the next before this one expires, and
#             can keep the session alive for as long as you leave the
#             server up.
#   "off"   — no schedule tool is registered at all. The model cannot see
#             the door. Choose this if scheduling should be your decision
#             and nobody else's.
#
# The model states its timing with in_seconds, every_seconds, cron or at
# — one of the four. in_seconds is a one-shot that many seconds from now,
# and it exists because the model is told neither the date nor the time
# and so cannot work out an absolute instant for at; cron is the same
# five-field UTC expression the tables above take. It may also narrow the
# expiry with max_fires and expires_after_s, which cannot widen it.
#
# A model-created schedule is held to every limit a [[schedule]] table
# above is held to, and it cannot raise any of them: it expires on both
# max_fires and expires_after_s with the earlier winning, and one session
# holds a limited number of them at once. Those bounds hold under every
# setting; what "wake" adds is the one thing they do not bound, which is
# how long a session that nobody is prompting keeps running.
#
# It fires onto the strand that created it, or onto a strand that strand
# SPAWNED — a subagent it started, so a parent agent can watch its own
# unattended work — and nowhere else. A strand cannot schedule onto a
# sibling, onto its parent, or onto anything it did not start; the server
# decides that from its own record of who spawned whom, not from a name
# the model wrote. A schedule onto a subagent never wakes it under any
# setting, "wake" included: a subagent has one run, so it steers that run
# while there is one and ends when the subagent's work does. Whichever
# strand a schedule fires onto, only the strand that created it can list
# or cancel it.
[schedules]
model_created = "steer"


# What the jailed tool shells may reach. The whole table is optional, and
# leaving it out means exactly what is written below: no network, and an
# environment of the three names the server owns.
#
#   network = "off"  — the DEFAULT. bwrap unshares the network namespace
#                      and seccomp denies the socket calls, so `gh`,
#                      `git fetch` and `curl` do not work inside the
#                      jail. That is the design and not an oversight:
#                      egress is the exfiltration channel, and a model
#                      that can read your repository and open a socket
#                      can send it anywhere.
#   network = "full" — unrestricted egress for every jailed tool shell.
#                      This is YOUR decision to make per catalogue, and
#                      it is the whole of the decision: there is no
#                      host allowlist, because filtering by host needs
#                      an egress proxy the spec defers, and a key that
#                      accepted hosts would promise filtering nothing
#                      enforces.
#
# `env` names host environment variables passed into every jailed tool
# shell. The NAMES live here; the values are read from the server's own
# environment at boot, the same discipline `api_key_env` follows. A name
# the host has not set is skipped with one warning line at boot, never a
# boot failure — a tool that wanted it says so in band when it runs.
#
# [tools.set] carries literal variables, for pointing a tool at
# configuration outside the workspace (gh's login store, say).
#
# PATH, HOME and TMPDIR may not appear in either list. The server derives
# all three from the workspace and the toolchain code mode found, and a
# shell that took one from this file would resolve a different `gleam`
# than the compiler does, or source your own dotfiles from inside the
# jail.
[tools]
network = "off"
# env = ["GH_TOKEN"]

# [tools.set]
# GH_CONFIG_DIR = "/home/me/.config/gh"
