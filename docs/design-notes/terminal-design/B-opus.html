<title>Terminal Concept B</title>
<style>
:root {
  --bg: #fbfcfd; --fg: #202b3c; --q: #4e5d6f; --c: #00687d; --s: #894d00;
  --a: #6a40a1; --d: #b2233b; --g: #236f3a; --dv: #a2b1c2; --t2: #0b6e60;
  --t3: #5d6b14; --pr: #9b2f73;
  --ov: #f3f5f8; --sel: #dce7f3; --ub: #f6eedd; --ab: #e4f2f3;
  --addbg: #e0f2e4; --rs: #f9e4e8; --cd: #eef1f5;
  --page: #e9edf2; --ink: #202b3c; --muted: #4e5d6f; --edge: #c5cfda;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1318; --fg: #e7edf5; --q: #a0abb8; --c: #6edbe8; --s: #ffbd69;
    --a: #c0a6f5; --d: #ff8e9b; --g: #8ed6a1; --dv: #3c4a5b; --t2: #7fd6c2;
    --t3: #c3cf7e; --pr: #f0a6ca;
    --ov: #181b1f; --sel: #25303f; --ub: #26221d; --ab: #142023;
    --addbg: #183423; --rs: #391b1f; --cd: #1b2027;
    --page: #07090c; --ink: #e7edf5; --muted: #a0abb8; --edge: #2a3542;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1318; --fg: #e7edf5; --q: #a0abb8; --c: #6edbe8; --s: #ffbd69;
  --a: #c0a6f5; --d: #ff8e9b; --g: #8ed6a1; --dv: #3c4a5b; --t2: #7fd6c2;

  --page: #07090c; --ink: #e7edf5; --muted: #a0abb8; --edge: #2a3542;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, sans-serif; }
header { max-width: 1600px; margin: 0 auto; padding: 24px 16px 8px; }
header h1 { font-size: 22px; margin: 0 0 4px; }
header p { margin: 0; color: var(--muted); max-width: 80ch; }
button { font: inherit; padding: 4px 12px; border-radius: 6px;
  border: 1px solid var(--edge); background: var(--bg); color: var(--ink); cursor: pointer; }
main { max-width: 1600px; margin: 0 auto; padding: 8px 16px 48px; }
section { margin: 28px 0; }
section h2 { font-size: 16px; margin: 0 0 2px; }
section p { margin: 0 0 8px; color: var(--muted); max-width: 100ch; font-size: 14px; }
.scroll { overflow-x: auto; max-width: 100%; }
pre.grid { display: inline-block; margin: 0; padding: 10px 12px; background: var(--bg);
  color: var(--fg); border: 1px solid var(--edge); border-radius: 6px;
  font: 13px/1.22 Menlo, "SF Mono", ui-monospace, monospace; white-space: pre; }
pre.w200 { font-size: 11.5px; }
.q, .m { color: var(--q); } .c, .cb { color: var(--c); } .s, .sb { color: var(--s); }
.a { color: var(--a); } .d { color: var(--d); } .g { color: var(--g); }
.dv { color: var(--dv); } .t2 { color: var(--t2); } .t3 { color: var(--t3); } .pr { color: var(--pr); }
.b, .cb, .sb { font-weight: 700; } .u { text-decoration: underline; }
.ov { background: var(--ov); } .sel { background: var(--sel); } .ub { background: var(--ub); }
.ab { background: var(--ab); } .addbg { background: var(--addbg); } .rs { background: var(--rs); }
.cd { background: var(--cd); }
body.single header, body.single section h2, body.single section p { display: none; }
body.single main { padding: 12px; max-width: none; }
body.single section { margin: 0; }
</style>
</head>
